name: CI
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml
    with:
      fail-on-error: true
      python-version: "3.14"
  security:
    name: Security Scan
    uses: ./.github/workflows/security-scan.yml
    with:
      fail-on-error: true
      python-version: "3.14"
  test:
    name: Test
    uses: ./.github/workflows/test.yml
    with:
      python-version: "3.14"
